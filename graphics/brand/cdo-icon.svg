<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <title>Cloud Dental Office logo</title>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="0.45" stop-color="#9ea9b5"/>
      <stop offset="1" stop-color="#58626e"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#101c28"/>
      <stop offset="1" stop-color="#04070b"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield -->
  <path d="M200 24 C250 50 310 62 368 68 L368 250 C368 350 290 410 200 456 C110 410 32 350 32 250 L32 68 C90 62 150 50 200 24 Z" fill="url(#steel)"/>
  <path d="M200 44 C246 67 300 78 352 83 L352 250 C352 340 282 394 200 437 C118 394 48 340 48 250 L48 83 C100 78 154 67 200 44 Z" fill="url(#field)" stroke="#2ea6ff" stroke-width="3" filter="url(#glow)"/>

  <!-- Circuit traces -->
  <g id="traces" fill="none" stroke="#2ea6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <g id="left">
      <path d="M146 142 L128 124 L128 104"/><circle cx="128" cy="100" r="3.4" fill="#06101a"/>
      <path d="M172 132 L172 112 L162 102 L162 80"/><circle cx="162" cy="76" r="3.4" fill="#06101a"/>
      <path d="M188 140 L188 70"/><circle cx="188" cy="66" r="3.4" fill="#06101a"/>
      <path d="M140 150 L118 150 L102 134 L102 118"/><circle cx="102" cy="114" r="3.4" fill="#06101a"/>
      <path d="M124 168 L86 168"/><circle cx="82" cy="168" r="3.4" fill="#06101a"/>
      <path d="M128 186 L108 186 L96 198 L72 198"/><circle cx="68" cy="198" r="3.4" fill="#06101a"/>
      <path d="M134 206 L114 206 L102 218 L86 218"/><circle cx="82" cy="218" r="3.4" fill="#06101a"/>
      <path d="M140 236 L94 236"/><circle cx="90" cy="236" r="3.4" fill="#06101a"/>
      <path d="M146 254 L122 254 L108 268 L88 268"/><circle cx="84" cy="268" r="3.4" fill="#06101a"/>
      <path d="M152 278 L136 278 L124 290 L124 312"/><circle cx="124" cy="316" r="3.4" fill="#06101a"/>
      <path d="M162 310 L148 324 L148 356"/><circle cx="148" cy="360" r="3.4" fill="#06101a"/>
      <path d="M194 300 L194 344"/><circle cx="194" cy="348" r="3.4" fill="#06101a"/>
    </g>
    <use href="#left" transform="translate(400 0) scale(-1 1)"/>
