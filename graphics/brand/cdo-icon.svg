  <!-- Low-poly tooth -->
  <g stroke="#e6ecf2" stroke-opacity="0.4" stroke-width="0.9" stroke-linejoin="round">
    <polygon points="152,120 200,140 200,188" fill="#d9dee4"/>
    <polygon points="200,140 248,120 200,188" fill="#aab3bd"/>
    <polygon points="116,158 152,120 200,188" fill="#eef1f4"/>
    <polygon points="248,120 284,158 200,188" fill="#8a939e"/>
    <polygon points="116,158 200,188 132,220" fill="#b8c0c9"/>
    <polygon points="284,158 268,220 200,188" fill="#6c757f"/>
    <polygon points="132,220 200,188 200,248" fill="#7f8893"/>
    <polygon points="200,188 268,220 200,248" fill="#555d67"/>
    <polygon points="132,220 200,248 150,286" fill="#c4cbd3"/>
    <polygon points="200,248 268,220 250,286" fill="#474e57"/>
    <polygon points="200,248 200,272 188,296" fill="#6a737d"/>
